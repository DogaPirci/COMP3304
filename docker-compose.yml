services:
  # ── Backend (Express + TypeScript) ─────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    volumes:
      # Mount source code for hot-reload
      - ./Backend:/app
      # Isolate node_modules inside the container (Windows performance)
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  # ── Frontend (Vite + React) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env          # Shares same env (GEMINI_API_KEY etc.)
    environment:
      - VITE_API_URL=http://backend:5000  # Docker internal hostname
    volumes:
      # Mount source code for hot-reload
      - ./Frontend:/app
      # Isolate node_modules inside the container (Windows performance)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:

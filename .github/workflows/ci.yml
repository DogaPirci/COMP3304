name: VogueVault CI/CD

on:
  push:
    branches: [ "main", "doga-pirci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Backend Dependencies
      working-directory: ./Backend
      run: npm install

    - name: Run Backend Tests
      working-directory: ./Backend
      run: |
        npm test
        node format-coverage.js

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Backend/coverage/

  frontend-build:
    name: Frontend - Build & Type Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./Frontend
      run: npm install

    - name: Build Frontend
      working-directory: ./Frontend
      run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build . -t voguevault:latest

  deploy:
    name: Deploy to Render
    needs: [backend-test, frontend-build, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          else
            echo "RENDER_DEPLOY_HOOK secret is not set, skipping manual trigger."
          fi
